<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="auth-wrap">
    <div class="container py-4">
        <div class="auth-card">
            <div class="card-soft p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge-soft">Create account</span>
                    <h2 class="fw-bold mt-3">Signup</h2>
                    <p class="soft-muted mb-0">Create your study dashboard account.</p>
                </div>

                <form th:action="@{/signup}"
                      method="post"
                      th:object="${user}"
                      autocomplete="off">

                    <input type="text"
                           th:field="*{name}"
                           class="form-control input-soft mb-3"
                           placeholder="Name"
                           autocomplete="off"
                           required>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control input-soft mb-3"
                           placeholder="Email"
                           autocomplete="off"
                           autocapitalize="none"
                           required>

                    <input type="password"
                           th:field="*{password}"
                           class="form-control input-soft mb-3"
                           placeholder="Password"
                           autocomplete="new-password"
                           required>

                    <button class="btn btn-brand w-100">
                        Signup
                    </button>
                </form>

                <p class="text-danger mt-3 mb-0" th:text="${error}"></p>

                <div class="text-center mt-4">
                    <a href="/login" class="soft-muted">Already have an account?</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
