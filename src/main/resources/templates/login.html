<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div class="auth-wrap">
    <div class="container py-4">
        <div class="auth-card">
            <div class="card-soft p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="badge-soft">Welcome back</span>
                    <h2 class="fw-bold mt-3">Login to your account</h2>
                    <p class="soft-muted mb-0">Continue to your dashboard and chatbot.</p>
                </div>

                <div th:if="${param.signupSuccess}" class="alert alert-success">
                    Account created successfully. Please login.
                </div>

                <form action="/login" method="post" autocomplete="off">
                    <input type="email"
                           name="email"
                           class="form-control input-soft mb-3"
                           placeholder="Email"
                           autocomplete="off"
                           autocapitalize="none"
                           required>

                    <input type="password"
                           name="password"
                           class="form-control input-soft mb-3"
                           placeholder="Password"
                           autocomplete="off"
                           required>

                    <button class="btn btn-brand w-100">
                        Login
                    </button>
                </form>

                <p class="text-danger mt-3 mb-0" th:text="${error}"></p>

                <div class="text-center mt-4">
                    <a href="/signup" class="soft-muted">Create a new account</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
