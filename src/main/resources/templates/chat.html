<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-soft sticky-top">
    <div class="container py-2">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/dashboard">
            <span class="brand-mark"></span>
            <span>AI Study Assistant</span>
        </a>

        <div class="ms-auto d-flex gap-2">
            <a href="/dashboard" class="btn btn-soft">Dashboard</a>
            <a href="/logout" class="btn btn-brand">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="hero-card mb-4">
        <span class="badge-soft">AI chatbot</span>
        <h1 class="fw-bold mt-3 mb-2">Ask your study doubts here</h1>
        <p class="soft-muted mb-0">Use it for concepts, revision tips, exam preparation, and quick explanations.</p>
    </div>

    <div class="card-soft p-4">
        <form action="/chat" method="post">
            <textarea name="question"
                      class="form-control input-soft mb-3"
                      rows="5"
                      placeholder="Ask your question..."
                      required></textarea>

            <button class="btn btn-brand">Ask AI</button>
        </form>

        <div class="mt-4 response-panel" th:if="${question}">
            <h5 class="fw-bold mb-3">Your Question</h5>
            <p class="mb-4" th:text="${question}"></p>

            <h5 class="fw-bold mb-3">AI Response</h5>
            <p class="mb-0" th:text="${response}"></p>
        </div>
    </div>
</div>
</body>
</html>
